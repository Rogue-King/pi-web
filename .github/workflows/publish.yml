name: Release

# Publishes a pushed v* tag as @rogue-king/pi-web on npm.
# npm uses Trusted Publishing (OIDC): no npm token. The package's Trusted
# Publisher on npmjs.com names this repository and this file (publish.yml), so
# keep its name.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    if: github.repository == 'Rogue-King/pi-web'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          test "$(node -p "require('./package.json').name")" = "@rogue-king/pi-web"
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  npm:
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing requires npm 11.5.1 or later.
      - run: npm install --global npm@11.19.0
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm publish --access public
