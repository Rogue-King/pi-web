name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'Rogue-King/pi-web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        run: |
          git merge-base --is-ancestor HEAD origin/magi
          test "$(node -p "require('./package.json').name")" = "@rogue-king/pi-web"
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Expected a stable version and its matching tag"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Pack and verify production output
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          tar -xOzf "release/rogue-king-pi-web-${GITHUB_REF_NAME#v}.tgz" package/.next/BUILD_ID | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          registry-url: https://registry.npmjs.org
      # Trusted Publishing requires npm 11.5.1 or later.
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Publish to npm
        run: npm publish "./rogue-king-pi-web-${GITHUB_REF_NAME#v}.tgz" --access public --ignore-scripts
        env:
          # Only needed to bootstrap the package; remove after setting up OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
